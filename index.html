<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta http-equiv="Content-Security-Policy" content="
      default-src 'self';
      script-src 'self' 'nonce-randomNonce' https://cdn.jsdelivr.net;
      style-src 'self' https://cdn.jsdelivr.net https://fonts.googleapis.com;
      font-src 'self' https://fonts.gstatic.com https://cdn.jsdelivr.net;
      img-src 'self' data: https://flagcdn.com;">
  <!-- Preload and Load Fonts -->
  <link href="https://cdn.jsdelivr.net/npm/remixicon/fonts/remixicon.css" rel="stylesheet" />
  <link rel="preload"
    href="https://fonts.googleapis.com/css2?family=Damion&family=Mynerve&family=Poppins&family=Grandstander:wght@100;200;300;400;500;600;700;800;900&display=swap"
    as="style" />
  <link
    href="https://fonts.googleapis.com/css2?family=Damion&family=Mynerve&family=Poppins&family=Grandstander:wght@100;200;300;400;500;600;700;800;900&display=swap"
    rel="stylesheet" />
  <link rel="stylesheet" href="style/maincss.css" />
  <title>FessCafee</title>
</head>

<body>
  <!-- Preloader Section -->
  <div id="preloader">
    <video id="preloader-video" autoplay muted playsinline>
      <source src="assets/kIHslNH6ZE.mp4" type="video/mp4" />
      Your browser does not support the video tag.
    </video>
    <p id="preloader-text">
      <span>Fess Lounge & Caffe</span><br />brought to you by <br /><span class="third">Bejtulla Dernjani & Hadis
        Alimi</span>
    </p>
  </div>

  <!-- Main Content -->
  <div id="main-content">
    <header class="navbar">
      <div class="logo">
        <a href="#home"><img src="assets/fesi123456.png" alt="Logo" /></a>
      </div>

      <nav>
        <ul class="nav-links">
          <li><a href="#home" data-translate="home">Home</a></li>
          <li><a href="#menu" data-translate="menu">Menu</a></li>
          <!-- Language Switcher as a Dropdown Item -->
          <li class="language-switcher">
            <div id="language-switcher">
              <img src="https://flagcdn.com/w40/gb.png" alt="English" title="English" data-lang="en" />
              <img src="https://flagcdn.com/w40/mk.png" alt="Macedonian" title="Macedonian" data-lang="mk" />
            </div>
          </li>
        </ul>
      </nav>

      <!-- Mobile Menu Toggle -->
      <button class="menu-btn">
        <i class="ri-menu-fill"></i>
        <!-- Menu icon -->
      </button>
    </header>

    <section class="hero reveal" id="home">
      <div class="hero-text">
        <h1 data-translate="delight">Welcome to fess</h1>
        <h2>
          <span id="enjoy" data-translate="enjoy">enjoy</span><br />
          <span data-translate="our">OUR</span>
          <span id="first" data-translate="meals">MEALS</span>
          <span data-translate="and">AND</span>
          <span id="second" data-translate="drinks">DRINKS</span>
        </h2>

        <p data-translate="menuDescription">
          Check our menu below, and choose something from our delicious food
          and drinks
        </p>
        <a href="#menu" class="hero-button" data-translate="checkMenu">Check Our Menu</a>
      </div>
      <div class="hero-image">
        <img src="assets/chef (2).png" alt="heroimage" />
      </div>
    </section>
    <!-- Menu Grid Section -->
    <section class="menu-grid reveal" id="menu">
      <div class="grid-container">
        <div class="grid-item" data-item="lunch" id="lunch">
          <a href="pages/lunch.html"><img src="assets/Lunch.png" alt="Lunch" /></a>
        </div>
        <div class="grid-item" data-item="pasta" id="pasta">
          <a href="pages/pasta.html"><img src="assets/Pasta.png" alt="Pasta" /></a>
        </div>
        <div class="grid-item" data-item="pizza" id="pizza">
          <a href="pages/pizza.html"><img src="assets/Pizza.png" alt="Pizza" /></a>
        </div>
        <div class="grid-item" data-item="breakfast" id="breakfast">
          <a href="pages/breakfast.html"><img src="assets/Breakfast.png" alt="Breakfast" /></a>
        </div>
        <div class="grid-item" data-item="salads" id="salads">
          <a href="pages/salads.html"><img src="assets/Salads.png" alt="Salads" /></a>
        </div>
        <div class="grid-item" data-item="drinks" id="drinks">
          <a href="pages/drinks-selection.html"><img src="assets/Drinks.png" alt="Drinks" /></a>
        </div>
        <div class="grid-item" data-item="desserts" id="desserts">
          <a href="pages/desserts.html"><img src="assets/Desserts.png" alt="Desserts" /></a>
        </div>
        <div class="grid-item" data-item="extras" id="extras">
          <a href="pages/extras.html"><img src="assets/Extras.png" alt="Extras" /></a>
        </div>
      </div>
    </section>
  </div>
  <script nonce="randomNonce" src="scripts/languageSwitcher.js"></script>
  <script nonce="randomNonce" src="https://cdn.jsdelivr.net/npm/@vercel/analytics/dist/index.mjs"
    type="module"></script>
  <script nonce="randomNonce" src="scripts/inline-scripts.js" type="module"></script>
  <script nonce="randomNonce" src="scripts/script.js"></script>
  <script nonce="randomNonce" src="scripts/security.js"></script>
</body>

</html>
